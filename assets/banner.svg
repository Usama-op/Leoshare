<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#151522"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5c4"/>
      <stop offset="50%" stop-color="#7c3aff"/>
      <stop offset="100%" stop-color="#ff3a6e"/>
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- soft glow blobs -->
  <circle cx="150" cy="60" r="140" fill="#00f5c4" opacity="0.18" filter="url(#soften)"/>
  <circle cx="1050" cy="240" r="160" fill="#ff3a6e" opacity="0.16" filter="url(#soften)"/>
  <circle cx="600" cy="260" r="120" fill="#7c3aff" opacity="0.18" filter="url(#soften)"/>

  <!-- glass card -->
  <rect x="60" y="55" width="1080" height="190" rx="28" fill="#ffffff" opacity="0.04"/>
  <rect x="60" y="55" width="1080" height="190" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <text x="150" y="150" font-size="92" font-family="Arial, sans-serif" text-anchor="middle">🦁</text>

  <text x="230" y="140" font-size="64" font-weight="700" font-family="Arial, sans-serif" fill="#ffffff">LioShare</text>
  <text x="230" y="180" font-size="24" font-family="Arial, sans-serif" fill="#b6b6c4">Ultra-fast, serverless, peer-to-peer file sharing</text>

  <rect x="230" y="200" width="640" height="4" rx="2" fill="url(#glow)"/>
</svg>
